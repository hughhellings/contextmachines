<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally</title>
<style>
  :root { --bg: #f7f7f5; --side: #fbfbfa; --card: #fff; --text: #17181c; --muted: #6b6f78; --faint: #9a9ea6; --border: #e7e7e3; --accent: #4f46e5; --accent-soft: #eef0ff; --warn: #b4321f; --warn-soft: #fdecea; --ok: #16794c; --ok-soft: #e7f6ee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  header { background: var(--side); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 100vh; }
  header strong { display: flex; align-items: center; gap: 10px; font-size: 15px; letter-spacing: -0.01em; padding: 4px 10px 18px; }
  header strong::before { content: ""; width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #6366f1, #4338ca); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  header a { color: var(--muted); text-decoration: none; padding: 7px 10px; border-radius: 8px; font-weight: 500; }
  header a:hover { background: #f0f0ed; color: var(--text); }
  header a[aria-current="page"] { background: #ececea; color: var(--text); font-weight: 600; }
  main { max-width: 920px; width: 100%; padding: 36px 44px 60px; }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .page-head .muted { margin: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin: 16px 0; box-shadow: 0 1px 2px rgba(16,17,20,.04); }
  form.card { max-width: 560px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(16,17,20,.04); }
  .stat span { display: block; color: var(--muted); font-size: 13px; }
  .stat strong { display: block; font-size: 24px; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .stat em { font-style: normal; font-size: 12px; color: var(--faint); }
  .stat em.warn { color: var(--warn); }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; font: inherit; background: #fff; margin-top: 6px; font-weight: 400; }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; margin-top: 16px; margin-right: 8px; display: inline-block; box-shadow: 0 1px 2px rgba(16,17,20,.05); }
  .actions button { margin-top: 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .muted { color: var(--muted); }
  .hint { font-size: 12px; color: var(--faint); }
  .status { font-size: 12px; color: var(--faint); margin-top: 8px; min-height: 1em; }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #f0f0ed; color: var(--muted); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  @media (max-width: 760px) {
    body { display: block; }
    header { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); padding: 10px 12px; }
    header strong { padding: 4px 10px; width: 100%; }
    main { padding: 24px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <strong>Tally</strong>
  <a href="/dashboard" data-nav>Dashboard</a>
  <a href="/clients/new" data-nav>Clients</a>
  <a href="/invoices/new" data-nav>New invoice</a>
  <a href="/reports" data-nav>Reports</a>
  <a href="/settings/payments" data-nav>Settings</a>
  <!--changed:nav-->
</header>
<main id="app"></main>
<script>
/*
 * A small invoicing app to try Context Machines on. It is a single-page app (history.pushState
 * routing), the way most products are built, and it has the problems real products ship with:
 *   - "Import invoices" on the dashboard does nothing when pressed
 *   - "Reg. no." on the invoice form is required, and nothing says what it is
 *   - "Send invoice" fails until payments are connected, and says so only faintly
 * server.mjs serves it; with --changed it serves the same app after a small change.
 */
const CHANGED = document.documentElement.dataset.changed === "yes";
const api = (path, body) => fetch(path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json" }, ...(body ? { body: JSON.stringify(body) } : {}) });
const app = document.getElementById("app");
const go = (path) => { history.pushState({}, "", path); render(); };
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-nav]");
  if (a) { e.preventDefault(); go(a.getAttribute("href")); }
});
addEventListener("popstate", render);

const exportCard = `<div class="card"><p>Every invoice and payment, as a spreadsheet.</p><button id="export">Export CSV</button><div class="status" id="status"></div></div>`;
const wireExport = () => (document.getElementById("export").onclick = async () => {
  const res = await api("/api/reports/export", {});
  document.getElementById("status").textContent = res.ok ? "Exported." : "Couldn't export.";
});

const pages = {
  "/login": () => ({
    title: "Log in",
    html: `<h1>Welcome back</h1><form class="card" id="f"><label>Email <input name="email" type="email" required></label><label>Password <input name="password" type="password" required></label><button class="primary">Log in</button></form>`,
    wire: () => form("f", async () => { await api("/api/auth/login", {}); go("/dashboard"); }),
  }),
  "/dashboard": () => ({
    title: "Dashboard",
    html: `<div class="page-head"><div><h1>Dashboard</h1><p class="muted">Create an invoice and send it to get paid.</p></div><div class="actions"><button id="import">Import invoices</button><button class="primary" id="new">New invoice</button></div></div>
      <div class="stats"><div class="stat"><span>Outstanding</span><strong>£4,820.00</strong><em>6 invoices</em></div><div class="stat"><span>Overdue</span><strong>£1,250.00</strong><em class="warn">2 invoices</em></div><div class="stat"><span>Paid this month</span><strong>£0.00</strong><em>Connect payments to get paid</em></div></div>
      <div class="card"><h2>Recent invoices</h2><div class="table"><table><tr><th>Invoice</th><th>Client</th><th>Status</th><th class="num">Amount</th></tr>
        <tr><td>INV-1042</td><td>Acme Ltd</td><td><span class="badge warn">Overdue</span></td><td class="num">£1,250.00</td></tr>
        <tr><td>INV-1041</td><td>Globex</td><td><span class="badge">Sent</span></td><td class="num">£850.00</td></tr>
        <tr><td>INV-1040</td><td>Initech</td><td><span class="badge">Draft</span></td><td class="num">£2,400.00</td></tr></table></div></div>`,
    wire: () => {
      document.getElementById("new").onclick = () => go("/invoices/new");
      // Looks like it works, does nothing: the kind of issue Context Machines proves.
      document.getElementById("import").onclick = () => {};
    },
  }),
  "/clients/new": () => ({
    title: "New client",
    html: `<h1>New client</h1><form class="card" id="f">
      <label>Name <input name="name" required></label>
      <label>Email <input name="client_email" type="email" required></label>
      <label>Billing address <input name="address" required></label>
      <label>VAT number <input name="vat" required></label>
      <button class="primary">Save client</button></form>`,
    wire: () => form("f", async () => { await api("/api/clients", {}); go("/invoices/new"); }),
  }),
  "/invoices/new": () => ({
    title: "New invoice",
    html: `<h1>Create invoice</h1><form class="card" id="f">
      <label>Client <select name="client" required><option value="">Choose…</option><option>Acme Ltd</option><option>Globex</option></select></label>
      <label>Amount <input name="amount" type="number" min="1" required></label>
      <label>Reg. no. <input name="reg_no" required></label><span class="hint">ref</span>
      <button class="primary">Save invoice</button></form>`,
    wire: () => form("f", async () => { const r = await api("/api/invoices", {}); const { id } = await r.json(); go(`/invoices/${id}`); }),
  }),
  "/invoices/:id": (id) => ({
    title: `Invoice ${id}`,
    html: `<h1>Invoice INV-${id}</h1><div class="card"><table><tr><th>Status</th><td id="state">Draft</td></tr></table>
      <button class="primary" id="send">${CHANGED ? "Email invoice" : "Send invoice"}</button>${CHANGED ? `<button id="duplicate">Duplicate invoice</button>` : ""}
      <div class="status" id="status"></div></div>`,
    wire: () => {
      document.getElementById("send").onclick = async () => {
        const r = await api(`/api/invoices/${id}/send`, {});
        document.getElementById("status").textContent = r.ok ? "" : "Couldn't send.";
        if (r.ok) document.getElementById("state").textContent = "Sent";
      };
      if (CHANGED) document.getElementById("duplicate").onclick = async () => { const r = await api(`/api/invoices/${id}/duplicate`, {}); const { id: copy } = await r.json(); go(`/invoices/${copy}`); };
    },
  }),
  "/settings/payments": () => ({
    title: "Payments",
    html: `<h1>Get paid online</h1><form class="card" id="f"><p class="muted">Connect a bank account so clients can pay invoices.</p>
      <label>Account number <input name="account" required></label><button class="primary">Connect payments</button><div class="status" id="status"></div></form>`,
    wire: () => form("f", async () => { await api("/api/payments/connect", {}); document.getElementById("status").textContent = "Connected."; }),
  }),
  "/reports": () => ({
    title: "Reports",
    html: `<h1>Reports</h1><div class="card"><p>Paid this month: <strong>£0</strong></p><p class="muted">Send invoices to see payments here.</p></div>${CHANGED ? "" : exportCard}`,
    wire: () => { if (!CHANGED) wireExport(); },
  }),
  ...(CHANGED ? {
    "/settings/exports": () => ({ title: "Exports", html: `<h1>Exports</h1>${exportCard}`, wire: wireExport }),
  } : {}),
};

function form(id, onSubmit) {
  document.getElementById(id).addEventListener("submit", (e) => { e.preventDefault(); onSubmit(); });
}

function render() {
  const path = location.pathname === "/" ? "/login" : location.pathname;
  const invoice = path.match(/^\/invoices\/(\d+)$/);
  const page = invoice ? pages["/invoices/:id"](invoice[1]) : (pages[path] || pages["/dashboard"])();
  document.title = `${page.title} | Tally`;
  app.innerHTML = page.html;
  page.wire();
  for (const a of document.querySelectorAll("a[data-nav]")) a.toggleAttribute("aria-current", a.getAttribute("href") === path);
  for (const a of document.querySelectorAll("a[data-nav][aria-current]")) a.setAttribute("aria-current", "page");
}
render();
</script>
</body>
</html>
